openapi: 3.0.3
info:
  title: Workflow Agent Service API
  version: 0.1.0
  description: Versioned public HTTP contract for the workflow and Agent platform.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: Authentication
    description: Browser authentication and current session operations.
  - name: Workflow
    description: Process and task runtime operations.
  - name: Agent
    description: Agent definitions and asynchronous model runs.
  - name: AccessManagement
    description: Tenant member, role, and permission management.
  - name: Tenant
    description: Platform tenant administration.
  - name: Audit
    description: Tenant-scoped operational audit evidence.
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created and written to an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserAuthApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Read the current user and tenant context
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Authentication]
      operationId: updateProfile
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: Profile updated, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUserApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a normal user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserAuthApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/me/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Password changed, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/tenants:
    get:
      tags: [Authentication]
      operationId: listMyTenants
      summary: List tenants available to the current user
      responses:
        '200': { description: Tenant options, content: { application/json: { schema: { $ref: '#/components/schemas/TenantOptionListApiResponse' } } } }
  /auth/switch-tenant:
    post:
      tags: [Authentication]
      operationId: switchTenant
      summary: Switch the current tenant context
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchTenantRequest' }
      responses:
        '200': { description: Tenant switched, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserAuthApiResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: csrfToken
      summary: Read the CSRF token for browser requests
      responses:
        '200': { description: CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/StringApiResponse' } } } }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Clear the browser session cookie
      responses:
        '200': { description: Session cleared, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /auth/directory/users:
    get:
      tags: [Authentication]
      operationId: searchDirectoryUsers
      summary: Search users in the current tenant
      parameters:
        - { $ref: '#/components/parameters/Keyword' }
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Directory users, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryUserPageApiResponse' } } } }
  /auth/access/members:
    get:
      tags: [AccessManagement]
      operationId: listMembers
      summary: List tenant members
      parameters: [{ $ref: '#/components/parameters/Keyword' }]
      responses:
        '200': { description: Members, content: { application/json: { schema: { $ref: '#/components/schemas/TenantMemberListApiResponse' } } } }
    post:
      tags: [AccessManagement]
      operationId: addMember
      summary: Add a member to the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTenantMemberRequest' }
      responses:
        '200': { description: Member added, content: { application/json: { schema: { $ref: '#/components/schemas/TenantMemberApiResponse' } } } }
  /auth/access/members/{userId}/roles:
    post:
      tags: [AccessManagement]
      operationId: updateMemberRoles
      summary: Replace a member's tenant roles
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRolesRequest' }
      responses:
        '200': { description: Roles updated, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /auth/access/members/{userId}/enabled:
    post:
      tags: [AccessManagement]
      operationId: updateMemberEnabled
      summary: Enable or disable a tenant member
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: enabled, in: query, required: true, schema: { type: boolean } }
      responses:
        '200': { description: Member status updated, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /auth/access/roles:
    get:
      tags: [AccessManagement]
      operationId: listRoles
      summary: List tenant roles
      responses:
        '200': { description: Roles, content: { application/json: { schema: { $ref: '#/components/schemas/TenantRoleListApiResponse' } } } }
    post:
      tags: [AccessManagement]
      operationId: saveRole
      summary: Create or update a tenant role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTenantRoleRequest' }
      responses:
        '200': { description: Role saved, content: { application/json: { schema: { $ref: '#/components/schemas/TenantRoleApiResponse' } } } }
  /auth/access/permissions:
    get:
      tags: [AccessManagement]
      operationId: listPermissions
      summary: List available permissions
      responses:
        '200': { description: Permissions, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionListApiResponse' } } } }
  /workflow/tenant:
    get:
      tags: [Tenant]
      operationId: listTenants
      summary: Page tenants
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Keyword' }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Tenants, content: { application/json: { schema: { $ref: '#/components/schemas/TenantPageApiResponse' } } } }
    post:
      tags: [Tenant]
      operationId: createTenant
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCommand' }
      responses:
        '200': { description: Tenant created, content: { application/json: { schema: { $ref: '#/components/schemas/TenantApiResponse' } } } }
  /workflow/tenant/enabled:
    get:
      tags: [Tenant]
      operationId: listEnabledTenants
      summary: List enabled tenants
      responses:
        '200': { description: Enabled tenants, content: { application/json: { schema: { $ref: '#/components/schemas/TenantListApiResponse' } } } }
  /workflow/tenant/{id}:
    post:
      tags: [Tenant]
      operationId: updateTenant
      summary: Update a tenant
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCommand' }
      responses:
        '200': { description: Tenant updated, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /workflow/tenant/{id}/enabled:
    post:
      tags: [Tenant]
      operationId: updateTenantEnabled
      summary: Enable or disable a tenant
      parameters:
        - { $ref: '#/components/parameters/NumericId' }
        - { name: enabled, in: query, required: true, schema: { type: boolean } }
      responses:
        '200': { description: Tenant status updated, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /workflow/tenant/{id}/restore:
    post:
      tags: [Tenant]
      operationId: restoreTenant
      summary: Restore a tenant
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '200': { description: Tenant restored, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /workflow/process/start:
    post:
      tags: [Workflow]
      operationId: startProcess
      summary: Start a process instance
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessRequest'
      responses:
        '200':
          description: Process started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProcessApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /workflow/process/interaction:
    post:
      tags: [Workflow]
      operationId: getStartProcessInteraction
      summary: Generate the tenant-facing data contract for the next Agent frontier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessInteractionRequest' }
      responses:
        '200': { description: Generated interaction contract, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessInteractionApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /workflow/task/approve:
    post:
      tags: [Workflow]
      operationId: approveTask
      summary: Approve and complete a user task
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskActionApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /agents:
    get:
      tags: [Agent]
      operationId: listAgents
      summary: List Agent definitions
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Agent definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionPageApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Agent]
      operationId: createAgent
      summary: Create an Agent definition
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /agent-runs/manual-tests:
    post:
      tags: [Agent]
      operationId: submitAgentManualRun
      summary: Submit a manual Agent run
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualRunRequest'
      responses:
        '202':
          description: Run accepted for asynchronous execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunSubmissionApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /workflow/management/process/deploy:
    post:
      tags: [Workflow]
      operationId: deployProcess
      summary: Deploy a BPMN process definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeployProcessRequest' }
      responses:
        '200': { description: Process deployed, content: { application/json: { schema: { $ref: '#/components/schemas/DeployProcessApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /workflow/management/process/definition/activate:
    post:
      tags: [Workflow]
      operationId: activateProcessVersion
      summary: Activate a process definition version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateProcessVersionRequest' }
      responses:
        '200': { description: Version activated, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveProcessVersionApiResponse' } } } }
  /workflow/management/process/definition/active:
    get:
      tags: [Workflow]
      operationId: getActiveProcessVersion
      summary: Read the active process version
      parameters: [{ $ref: '#/components/parameters/ProcessDefinitionKey' }]
      responses:
        '200': { description: Active version, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveProcessVersionApiResponse' } } } }
  /workflow/management/process/definition/exists:
    get:
      tags: [Workflow]
      operationId: processDefinitionExists
      summary: Check whether a process definition exists
      parameters: [{ $ref: '#/components/parameters/ProcessDefinitionKey' }]
      responses:
        '200': { description: Existence result, content: { application/json: { schema: { $ref: '#/components/schemas/BooleanApiResponse' } } } }
  /workflow/management/process/definitions:
    get:
      tags: [Workflow]
      operationId: listProcessDefinitions
      summary: List process definition versions
      parameters:
        - { name: processDefinitionKey, in: query, schema: { type: string } }
      responses:
        '200': { description: Process definitions, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessDefinitionListApiResponse' } } } }
  /workflow/management/process/definition:
    get:
      tags: [Workflow]
      operationId: getProcessDefinition
      summary: Read a process definition
      parameters:
        - { $ref: '#/components/parameters/ProcessDefinitionKey' }
        - { name: version, in: query, schema: { type: integer } }
      responses:
        '200': { description: Process definition, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessDefinitionApiResponse' } } } }
    delete:
      tags: [Workflow]
      operationId: deleteProcessDefinitions
      summary: Delete process definition versions
      parameters: [{ $ref: '#/components/parameters/ProcessDefinitionKey' }]
      responses:
        '200': { description: Definitions deleted, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /workflow/management/process/diagram:
    get:
      tags: [Workflow]
      operationId: getProcessInstanceDiagram
      summary: Render a process instance diagram
      parameters: [{ $ref: '#/components/parameters/ProcessInstanceId' }]
      responses:
        '200': { description: PNG diagram, content: { image/png: { schema: { type: string, format: binary } } } }
  /workflow/management/process/diagram-data:
    get:
      tags: [Workflow]
      operationId: getProcessInstanceDiagramData
      summary: Read process instance diagram data
      parameters: [{ $ref: '#/components/parameters/ProcessInstanceId' }]
      responses:
        '200': { description: Diagram data, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessDiagramApiResponse' } } } }
  /workflow/management/process/definitions/page:
    get:
      tags: [Workflow]
      operationId: pageProcessDefinitions
      summary: Page process definitions
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: processDefinitionKey, in: query, schema: { type: string } }
        - { name: processDefinitionName, in: query, schema: { type: string } }
        - { name: publishStatus, in: query, schema: { type: string, default: all } }
      responses:
        '200': { description: Process definition page, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessDefinitionPageApiResponse' } } } }
  /workflow/management/process/instances/page:
    get:
      tags: [Workflow]
      operationId: pageProcessInstances
      summary: Page process instances
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: processDefinitionKey, in: query, schema: { type: string } }
        - { name: processDefinitionName, in: query, schema: { type: string } }
        - { name: processInstanceId, in: query, schema: { type: string } }
        - { name: businessKey, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: all } }
      responses:
        '200': { description: Process instance page, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessInstancePageApiResponse' } } } }
  /workflow/management/process/instance/detail:
    get:
      tags: [Workflow]
      operationId: getProcessInstanceDetail
      summary: Read process instance detail
      parameters: [{ $ref: '#/components/parameters/ProcessInstanceId' }]
      responses:
        '200': { description: Process instance detail, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessInstanceDetailApiResponse' } } } }
  /workflow/management/process/instance/terminate:
    post:
      tags: [Workflow]
      operationId: terminateProcessInstance
      summary: Terminate a running process instance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerminateProcessRequest' }
      responses:
        '200': { description: Process terminated, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /workflow/management/process/definition/version:
    delete:
      tags: [Workflow]
      operationId: deleteProcessDefinitionVersion
      summary: Delete one process definition version
      parameters:
        - { $ref: '#/components/parameters/ProcessDefinitionKey' }
        - { name: version, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: Definition version deleted, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
  /workflow/management/audit/operations:
    get:
      tags: [Audit]
      operationId: pageWorkflowOperationAudits
      summary: Page workflow operation audit records
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: eventType, in: query, schema: { type: string, maxLength: 64 } }
        - { name: processInstanceId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: traceId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: occurredFrom, in: query, schema: { type: string, format: date-time } }
        - { name: occurredTo, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Workflow audit page, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowOperationAuditPageApiResponse' } } } }
  /workflow/process/participant-requirements:
    post:
      tags: [Workflow]
      operationId: getStartParticipantRequirements
      summary: Resolve participants required to start a process
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessParticipantRequirementsRequest' }
      responses:
        '200': { description: Participant requirements, content: { application/json: { schema: { $ref: '#/components/schemas/ParticipantRequirementListApiResponse' } } } }
  /mcp/connectors:
    post:
      tags: [Agent]
      operationId: createMcpConnector
      summary: Create an MCP connector version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpConnectorCommand' }
      responses:
        '200': { description: MCP connector version, content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectorVersionApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mcp/connector-versions/{id}/discover:
    post:
      tags: [Agent]
      operationId: discoverMcpTools
      summary: Discover and persist an MCP tool catalog
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '200': { description: MCP discovery result, content: { application/json: { schema: { $ref: '#/components/schemas/McpDiscoveryApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mcp/catalog-versions/{id}/publish:
    post:
      tags: [Agent]
      operationId: publishMcpCatalog
      summary: Publish an MCP tool catalog
      parameters: [{ $ref: '#/components/parameters/NumericId' }]
      responses:
        '200': { description: MCP catalog published, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mcp/agent-versions/{agentVersionId}/tools/{toolSnapshotId}:
    post:
      tags: [Agent]
      operationId: bindMcpToolToAgentVersion
      summary: Bind a published MCP tool snapshot to an Agent version
      parameters:
        - { name: agentVersionId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: toolSnapshotId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: MCP tool bound, content: { application/json: { schema: { $ref: '#/components/schemas/VoidApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workflow/process/status:
    get:
      tags: [Workflow]
      operationId: getProcessStatus
      summary: Read process status
      parameters: [{ $ref: '#/components/parameters/ProcessInstanceId' }]
      responses:
        '200': { description: Process status, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessStatusApiResponse' } } } }
  /workflow/task/status:
    get:
      tags: [Workflow]
      operationId: getTaskStatus
      summary: Read task status
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { description: Task status, content: { application/json: { schema: { $ref: '#/components/schemas/TaskApiResponse' } } } }
  /workflow/task/participant-requirements:
    post:
      tags: [Workflow]
      operationId: getTaskParticipantRequirements
      summary: Resolve participants required for a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskParticipantRequirementsRequest' }
      responses:
        '200': { description: Participant requirements, content: { application/json: { schema: { $ref: '#/components/schemas/ParticipantRequirementListApiResponse' } } } }
  /workflow/task/interaction:
    post:
      tags: [Workflow]
      operationId: getTaskInteraction
      summary: Generate the tenant-facing data contract for an Agent reached after task approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInteractionRequest' }
      responses:
        '200': { description: Generated interaction contract, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessInteractionApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /workflow/task/reject:
    post:
      tags: [Workflow]
      operationId: rejectTask
      summary: Reject a user task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '200': { description: Task rejected, content: { application/json: { schema: { $ref: '#/components/schemas/TaskActionApiResponse' } } } }
  /workflow/task/transfer:
    post:
      tags: [Workflow]
