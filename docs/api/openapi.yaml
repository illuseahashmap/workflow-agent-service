components:
  parameters:
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
    NumericId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NumericDefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NumericVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RunId:
