          type: array
          items: { $ref: '#/components/schemas/WorkflowOperationAudit' }
    WorkflowOperationAudit:
      type: object
      required: [id, eventType, tenantCode, actorType, actorId, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        eventType: { type: string }
        tenantCode: { type: string }
        actorType: { type: string }
        actorId: { type: string }
        actorUsername: { type: string, nullable: true }
        processInstanceId: { type: string, nullable: true }
        processDefinitionKey: { type: string, nullable: true }
        taskId: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        previousState: { type: string, nullable: true }
        nextState: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        traceId: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    McpConnectorCommand:
      type: object
      required: [connectorCode, connectorName, endpointUrl]
      properties:
        connectorCode: { type: string, minLength: 1, maxLength: 128 }
        connectorName: { type: string, minLength: 1, maxLength: 255 }
        endpointUrl: { type: string, format: uri, pattern: '^https://.*', maxLength: 2048 }
        protocolVersion: { type: string, maxLength: 64 }
        credentialRef: { type: string, maxLength: 255 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 300 }
