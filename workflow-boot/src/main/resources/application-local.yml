spring:
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:postgresql://localhost:5432/workflow_agent}
    username: ${WORKFLOW_DB_USERNAME:postgres}
    password: ${WORKFLOW_DB_PASSWORD:root}

flowable:
  database-schema-update: true

workflow:
  runtime:
    environment: development
  auth:
    self-registration:
      enabled: true
    token:
      cookie-secure: false
