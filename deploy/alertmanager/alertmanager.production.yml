route:
  receiver: operations-webhook
  group_by: [alertname, service, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /run/secrets/workflow-agent-alertmanager-webhook-url
        send_resolved: true
        max_alerts: 20
