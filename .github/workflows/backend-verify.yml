name: Backend Verify

on:
  push:
    branches:
      - init
      - main
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

      - name: Check OpenAPI endpoint coverage
        run: |
          npx --yes @redocly/cli@latest bundle docs/api/openapi.yaml \
            --output "$RUNNER_TEMP/openapi-current.json" --ext json
          node scripts/check-openapi-coverage.mjs "$RUNNER_TEMP/openapi-current.json" .

      - name: Check OpenAPI compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! git cat-file -e "origin/main:docs/api/openapi.yaml" 2>/dev/null; then
            echo "No OpenAPI baseline exists on origin/main; compatibility check is not applicable yet."
            exit 0
          fi
          git show "origin/main:docs/api/openapi.yaml" > "$RUNNER_TEMP/openapi-base.yaml"
          npx --yes @redocly/cli@latest bundle "$RUNNER_TEMP/openapi-base.yaml" \
            --output "$RUNNER_TEMP/openapi-base.json" --ext json
          npx --yes @redocly/cli@latest bundle docs/api/openapi.yaml \
            --output "$RUNNER_TEMP/openapi-current.json" --ext json
          node scripts/check-openapi-compatibility.mjs \
            "$RUNNER_TEMP/openapi-base.json" "$RUNNER_TEMP/openapi-current.json"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify all modules
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            **/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7
