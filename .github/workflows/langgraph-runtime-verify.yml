name: LangGraph Runtime Verify

on:
  push:
    branches: [main, init]
  pull_request:

permissions:
  contents: read

jobs:
  graph-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: langgraph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WORKFLOW_LANGGRAPH_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/langgraph_test
    defaults:
      run:
        working-directory: agent-runtime-langgraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install pinned uv and dependencies
        run: |
          python -m pip install uv==0.12.6
          uv sync --frozen
      - name: Lint and validate graph recovery with PostgreSQL
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
