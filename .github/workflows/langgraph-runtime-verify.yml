name: LangGraph Runtime Verify

on:
  push:
    branches: [main, init]
  pull_request:

permissions:
  contents: read

jobs:
  graph-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: langgraph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WORKFLOW_LANGGRAPH_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/langgraph_test
      WORKFLOW_LANGGRAPH_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/langgraph_test
      WORKFLOW_LANGGRAPH_JDBC_USER: postgres
      WORKFLOW_LANGGRAPH_JDBC_PASSWORD: isolated-test-only
      WORKFLOW_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/langgraph_test
      WORKFLOW_TEST_DATABASE_USER: postgres
      WORKFLOW_TEST_DATABASE_PASSWORD: isolated-test-only
    defaults:
      run:
        working-directory: agent-runtime-langgraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install pinned uv and dependencies
        run: |
          python -m pip install uv==0.12.6
          uv sync --frozen
      - name: Lint and validate graph recovery with PostgreSQL
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Verify version routing and real Flowable business lifecycle
        working-directory: .
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress -pl workflow-boot -am
          -Dsurefire.failIfNoSpecifiedTests=false -Dworkflow.p17.graph=true
          '-Dtest=AgentRuntimeBindingIntegrationTest,AgentBusinessHttpIntegrationTest,GraphDualPurchaseFlowableIntegrationTest,GraphCallReconciliationControllerTest,P17JointRunTest#scriptedRunsExercisePublishedBindingsAndOutbox,P17GraphJointRunTest#graphRunsExercisePublishedBindingsAndOutbox'
          test

      - name: Verify opt-in evidence contracts on both execution backends
        working-directory: .
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress -pl workflow-boot -am
          -Dsurefire.failIfNoSpecifiedTests=false -Dworkflow.p17.graph=true -Dworkflow.p17.evidence=true
          '-Dtest=P17JointRunTest#scriptedRunsExercisePublishedBindingsAndOutbox,P17GraphJointRunTest#graphRunsExercisePublishedBindingsAndOutbox'
          test

      - name: Archive governance acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-governance-acceptance
          path: |
            **/target/site/jacoco/**
            **/target/surefire-reports/**
            **/target/checkstyle-result.xml
            **/target/p17-runs/**
            **/target/p17-graph-runs/**
          if-no-files-found: error
          retention-days: 14
