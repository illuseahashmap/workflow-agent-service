spring:
  application:
    name: workflow-agent-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:postgresql://localhost:5432/workflow_agent}
    username: ${WORKFLOW_DB_USERNAME:workflow_agent}
    password: ${WORKFLOW_DB_PASSWORD:workflow_agent}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

flowable:
  database-schema-update: true
  async-executor-activate: true
  check-process-definitions: false

workflow:
  lock:
    key-prefix: workflow-agent-service:dev
    wait-seconds: 3
    ttl-seconds: 30
  security:
    enabled: true
    # Base64-encoded 256-bit AES key. Replace before running outside local development.
    master-key-base64: ${WORKFLOW_MASTER_KEY_BASE64:}
    replay-window-seconds: 300
    clock-skew-seconds: 30
    public-paths:
      - /actuator/health
      - /actuator/info
      - /auth/register
      - /auth/login
  auth:
    token:
      issuer: workflow-agent-service
      secret: ${WORKFLOW_AUTH_TOKEN_SECRET:local-dev-auth-token-secret-change-me}
      ttl-seconds: ${WORKFLOW_AUTH_TOKEN_TTL_SECONDS:7200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
