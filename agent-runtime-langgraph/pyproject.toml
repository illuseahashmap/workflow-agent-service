[project]
name = "workflow-agent-langgraph-runtime"
version = "0.1.0"
description = "Governed Agent graph execution; no commercial Agent Server dependency"
requires-python = ">=3.12,<3.15"
dependencies = [
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
  "langsmith==0.14.17", # OSS client: used only to explicitly disable cloud tracing.
    "psycopg[binary]==3.3.8",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_agent_runtime"]

[dependency-groups]
dev = [
    "langgraph-checkpoint-sqlite==3.1.3",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires an explicitly configured isolated PostgreSQL test server",
  "java: builds and exercises the Java governance gateway with PostgreSQL and Python",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
